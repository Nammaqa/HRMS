<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Offline - WizzyBox Attendance</title>
    <style>
      body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#0f172a;color:#e6eef8}
      .card{max-width:520px;padding:28px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.01));box-shadow:0 6px 24px rgba(2,6,23,0.6);text-align:center}
      a{color:#60a5fa;text-decoration:none;font-weight:600}
      h1{margin:0 0 8px;font-size:20px}
      p{margin:8px 0 0;color:#cfe8ff}
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>The app is not connected to the network right now. Some features may be unavailable.</p>
      <p style="margin-top:16px;"><a href="/">Open home (cached)</a> · <a href="/login">Open login (when online)</a></p>
    </div>
  </body>
</html>
